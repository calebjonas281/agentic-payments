<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mintty — Audit Log</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23e77d59'/><path d='M30 55 Q35 30 50 28 Q65 30 70 55' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round'/><circle cx='40' cy='52' r='4' fill='%23fff'/><circle cx='60' cy='52' r='4' fill='%23fff'/><path d='M43 62 Q50 68 57 62' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/><path d='M25 38 Q30 25 42 28' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/><path d='M75 38 Q70 25 58 28' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/></svg>" />
  <style>
    :root {
      --bg: #1f1f1d;
      --panel: #272724;
      --panel-strong: #30302c;
      --surface: #242421;
      --border: #3e3d38;
      --border-soft: #31302c;
      --text: #f3f0e9;
      --text-muted: #aaa69b;
      --text-faint: #817d74;
      --accent: #e77d59;
      --accent-strong: #f19972;
      --accent-soft: rgba(231,125,89,0.16);
      --green: #8fcf9b;
      --green-soft: rgba(143,207,155,0.14);
      --red: #ef7b8a;
      --red-soft: rgba(239,123,138,0.14);
      --blue: #6f8ddc;
      --blue-soft: rgba(111,141,220,0.16);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-link {
      font-size: 13px;
      color: var(--text-faint);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s;
    }

    .back-link:hover { color: var(--accent-strong); }

    header h1 {
      font-size: 16px;
      font-weight: 750;
      color: var(--text);
    }

    .header-meta {
      font-size: 12px;
      color: var(--text-faint);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .budget-pill {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .budget-pill .amt { color: var(--green); font-weight: 700; }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .refresh-btn:hover { color: var(--text); border-color: var(--text-muted); }

    main {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 32px 60px;
    }

    .summary-row {
      display: flex;
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 750;
      color: var(--text);
    }

    .stat-value.green { color: var(--green); }
    .stat-value.accent { color: var(--accent-strong); }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      padding: 12px 18px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    tbody td {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-soft);
      color: var(--text-muted);
      vertical-align: middle;
    }

    tbody tr:last-child td { border-bottom: none; }

    tbody tr:hover td { background: rgba(255,255,255,0.02); }

    .vendor-cell {
      color: var(--text);
      font-family: "SF Mono", Consolas, monospace;
      font-size: 12px;
    }

    .url-cell {
      font-size: 11px;
      color: var(--text-faint);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .amount-cell {
      color: var(--accent-strong);
      font-weight: 700;
      white-space: nowrap;
    }

    .amount-cell.dash { color: var(--text-faint); font-weight: 400; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .status-badge.pending   { background: rgba(244,183,64,0.15); color: #f4b740; }
    .status-badge.completed { background: var(--green-soft); color: var(--green); }
    .status-badge.failed    { background: var(--red-soft); color: var(--red); }
    .status-badge.reserved  { background: var(--blue-soft); color: var(--blue); }

    .time-cell {
      font-size: 11px;
      color: var(--text-faint);
      white-space: nowrap;
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-faint);
      font-size: 14px;
    }

    #loading {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-faint);
      font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <a class="back-link" href="/">← Mintty</a>
    <h1>Audit Log</h1>
  </div>
  <div class="header-meta">
    <div class="budget-pill">budget remaining: <span class="amt" id="budget-remaining">...</span> sats</div>
    <button class="refresh-btn" id="refresh-btn">Refresh</button>
  </div>
</header>

<main>
  <div class="summary-row">
    <div class="stat-card">
      <div class="stat-label">Total Spent Today</div>
      <div class="stat-value accent" id="stat-spent">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Successful Payments</div>
      <div class="stat-value green" id="stat-paid">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Transactions</div>
      <div class="stat-value" id="stat-total">—</div>
    </div>
  </div>

  <div class="section-title">Transactions</div>
  <div class="table-wrap">
    <div id="loading">Loading...</div>
    <table id="tx-table" style="display:none;">
      <thead>
        <tr>
          <th>Vendor</th>
          <th>URL</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="tx-body"></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none;">No transactions yet.</div>
  </div>
</main>

<script>
  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function statusBadge(status) {
    const icons = { completed: '✓', pending: '◎', failed: '✕', reserved: '◎' };
    const labels = { completed: 'PAID', pending: 'PENDING', failed: 'FAILED', reserved: 'RESERVED' };
    return `<span class="status-badge ${status}">${icons[status] || '?'} ${labels[status] || status.toUpperCase()}</span>`;
  }

  function relativeTime(dateStr) {
    const date = new Date(dateStr.replace(' ', 'T') + 'Z');
    const diffS = Math.floor((Date.now() - date) / 1000);
    if (diffS < 60) return 'just now';
    if (diffS < 3600) return `${Math.floor(diffS/60)}m ago`;
    if (diffS < 86400) return `${Math.floor(diffS/3600)}h ago`;
    return date.toLocaleDateString();
  }

  async function load() {
    try {
      const [txRes, budgetRes] = await Promise.all([
        fetch('/transactions?limit=200'),
        fetch('/budget'),
      ]);
      const { transactions: txns } = await txRes.json();
      const { remaining_sats } = await budgetRes.json();

      document.getElementById('budget-remaining').textContent = remaining_sats.toLocaleString();
      document.getElementById('loading').style.display = 'none';

      if (!txns.length) {
        document.getElementById('empty-state').style.display = 'block';
        return;
      }

      const paid = txns.filter(t => t.status === 'completed');
      const totalSpent = paid.reduce((s, t) => s + t.amount_sats, 0);

      document.getElementById('stat-spent').textContent = totalSpent.toLocaleString() + ' sats';
      document.getElementById('stat-paid').textContent = paid.length;
      document.getElementById('stat-total').textContent = txns.length;

      const tbody = document.getElementById('tx-body');
      tbody.innerHTML = '';
      for (const tx of txns) {
        const hasAmt = tx.amount_sats > 0;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="vendor-cell">${escapeHtml(tx.vendor)}</td>
          <td class="url-cell" title="${escapeHtml(tx.url)}">${escapeHtml(tx.url)}</td>
          <td class="amount-cell ${hasAmt ? '' : 'dash'}">${hasAmt ? tx.amount_sats.toLocaleString() + ' sats' : '—'}</td>
          <td>${statusBadge(tx.status)}</td>
          <td class="time-cell">${relativeTime(tx.created_at)}</td>
        `;
        tbody.appendChild(tr);
      }

      document.getElementById('tx-table').style.display = '';
    } catch (e) {
      document.getElementById('loading').textContent = 'Failed to load transactions.';
    }
  }

  document.getElementById('refresh-btn').addEventListener('click', () => {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('tx-table').style.display = 'none';
    document.getElementById('empty-state').style.display = 'none';
    load();
  });

  load();
</script>
</body>
</html>
